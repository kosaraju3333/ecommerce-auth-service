name: Auth DEV CD

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to DEV
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::828048069567:role/ecommerce-develop-github-actions-role
          aws-region: us-east-1

      - name: Show image to deploy
        run: |
          echo "Image tag from CI: ${{ inputs.image_tag }}"

      - name: Send SSM test command
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0734295b0b07de1d2" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo === GitHub CD SSM Test ===","whoami","hostname","docker ps"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "i-0734295b0b07de1d2"

      - name: Show SSM output
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "i-0734295b0b07de1d2" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'