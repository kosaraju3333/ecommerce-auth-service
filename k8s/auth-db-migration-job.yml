apiVersion: batch/v1
kind: Job
metadata:
  name: ecommerce-auth-migration-v1
  namespace: ecommerce-auth
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400

  template:
    spec:
      serviceAccountName: auth-service-account
      restartPolicy: Never

      containers:
        - name: alembic-migration
          image: 828048069567.dkr.ecr.us-east-1.amazonaws.com/ecommerce-auth-prod:v1
          imagePullPolicy: IfNotPresent

          command: ["alembic", "upgrade", "head"]

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-auth-credentials
                  key: DATABASE_URL

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-auth-credentials
                  key: SECRET_KEY

            - name: ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: ecommerce-auth-credentials
                  key: ALGORITHM

            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                secretKeyRef:
                  name: ecommerce-auth-credentials
                  key: ACCESS_TOKEN_EXPIRE_MINUTES

            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-auth-credentials
                  key: FRONTEND_URL

          volumeMounts:
            - name: auth-secrets
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: auth-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ecommerce-auth-secrets