apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ecommerce-auth-secrets
  namespace: ecommerce-auth
spec:
  provider: aws

  parameters:
    region: us-east-1
    usePodIdentity: "true"
    objects: |
      - objectName: "ecommerce/prod/auth"
        objectType: "secretsmanager"
        jmesPath:
          - path: DATABASE_URL
            objectAlias: DATABASE_URL
          - path: SECRET_KEY
            objectAlias: SECRET_KEY
          - path: ALGORITHM
            objectAlias: ALGORITHM
          - path: ACCESS_TOKEN_EXPIRE_MINUTES
            objectAlias: ACCESS_TOKEN_EXPIRE_MINUTES
          - path: FRONTEND_URL
            objectAlias: FRONTEND_URL

  secretObjects:
    - secretName: ecommerce-auth-credentials
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: SECRET_KEY
          key: SECRET_KEY
        - objectName: ALGORITHM
          key: ALGORITHM
        - objectName: ACCESS_TOKEN_EXPIRE_MINUTES
          key: ACCESS_TOKEN_EXPIRE_MINUTES
        - objectName: FRONTEND_URL
          key: FRONTEND_URL
